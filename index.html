<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Weltreise Planer</title>
<meta name="theme-color" content="#0f2f3f" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div id="app">
  <header id="app-header">
    <div class="header-brand">
      <img src="icons/icon-192.png" alt="" class="header-logo">
      <h1 id="header-title">Weltreise Planer</h1>
    </div>
    <span id="offline-badge" class="badge hidden">Offline</span>
  </header>

  <main id="view-root" role="main"></main>

  <button id="fab" class="fab hidden" aria-label="Hinzufügen">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav id="bottom-nav">
    <button class="nav-btn" data-view="dashboard">
      <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-6h4v6"/></svg></span>
      <span>Übersicht</span>
    </button>
    <button class="nav-btn" data-view="route">
      <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 4 6v14l5-2 6 2 5-2V6l-5-2-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg></span>
      <span>Route</span>
    </button>
    <button class="nav-btn" data-view="budget">
      <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><path d="M16 14.5h2"/></svg></span>
      <span>Budget</span>
    </button>
    <button class="nav-btn" data-view="prep">
      <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12.5h8M8 17h5"/></svg></span>
      <span>Vorbereitung</span>
    </button>
  </nav>
</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-box" class="modal-box"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
