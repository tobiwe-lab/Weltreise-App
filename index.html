<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Weltreise Planer</title>
<meta name="theme-color" content="#146c94" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header id="app-header">
    <h1 id="header-title">🌍 Weltreise Planer</h1>
    <span id="offline-badge" class="badge hidden">Offline</span>
  </header>

  <main id="view-root" role="main"></main>

  <button id="fab" class="fab hidden" aria-label="Hinzufügen">＋</button>

  <nav id="bottom-nav">
    <button class="nav-btn" data-view="dashboard"><span class="nav-icon">🏠</span><span>Übersicht</span></button>
    <button class="nav-btn" data-view="route"><span class="nav-icon">🗺️</span><span>Route</span></button>
    <button class="nav-btn" data-view="budget"><span class="nav-icon">💰</span><span>Budget</span></button>
    <button class="nav-btn" data-view="prep"><span class="nav-icon">✅</span><span>Vorbereitung</span></button>
  </nav>
</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-box" class="modal-box"></div>
</div>

<script src="app.js"></script>
</body>
</html>
